<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="../src/ui/style.css">
<style>
 body{margin:0;padding:12px 14px;background:#20160e;color:#f0dcbd;font:13px/1.5 "Segoe UI",system-ui,sans-serif}
 .t{font-size:16px;color:#ffd98a;font-weight:700;margin:0 0 6px}
 .grid{display:flex;flex-wrap:wrap;gap:8px}
 .cell{background:#2c1f14;border:1px solid #5a4426;border-radius:8px;padding:6px 5px;text-align:center}
 .box{display:grid;place-items:center;background:repeating-conic-gradient(#3a2a1a 0 25%,#241a11 0 50%) 0 0/16px 16px;border-radius:6px}
 .nm{font:12px/1.4 Consolas,monospace;color:#ffd98a;margin-top:4px}
 .meta{font-size:10px;color:#a68c66;max-width:100%}
 table{border-collapse:separate;border-spacing:6px}
 th{font:11px Consolas,monospace;color:#ffd98a;text-align:right;vertical-align:middle}
 .nbox{width:70px;height:70px;display:grid;place-items:center;background:#2c1f14;border:1px solid #5a4426;border-radius:6px}
 .med{width:56px;height:56px;background-color:currentColor}
 .ncap{font:10px Consolas,monospace;color:#c8ab7e;text-align:center;margin-top:2px}
 .b{color:#7ee08a}
</style></head><body><div class="t">④ 道具图标（7 个）</div><div class="grid"><div class="cell" style="width:110px">
   <div class="box" style="height:56px"><span class="ico-pill" style="width:52px;height:52px;background-color:#4a3524"></span></div>
   <div class="nm">好伤药</div><div class="meta">ico-pill<br>art=flask_half</div></div><div class="cell" style="width:110px">
   <div class="box" style="height:56px"><span class="ico-flask" style="width:52px;height:52px;background-color:#4a3524"></span></div>
   <div class="nm">厉害伤药</div><div class="meta">ico-flask<br>art=flask_full</div></div><div class="cell" style="width:110px">
   <div class="box" style="height:56px"><span class="ico-clover" style="width:52px;height:52px;background-color:#4a3524"></span></div>
   <div class="nm">幸运护符</div><div class="meta">ico-clover<br>art=shield</div></div><div class="cell" style="width:110px">
   <div class="box" style="height:56px"><span class="ico-sword" style="width:52px;height:52px;background-color:#4a3524"></span></div>
   <div class="nm">锐爪护符</div><div class="meta">ico-sword<br>art=sword</div></div><div class="cell" style="width:110px">
   <div class="box" style="height:56px"><span class="ico-shield" style="width:52px;height:52px;background-color:#4a3524"></span></div>

   <div class="box" style="height:56px"><span class="ico-shoe" style="width:52px;height:52px;background-color:#4a3524"></span></div>
   <div class="nm">疾风护符</div><div class="meta">ico-shoe<br>art=shield</div></div><div class="cell" style="width:110px">
   <div class="box" style="height:56px"><span class="ico-heal" style="width:52px;height:52px;background-color:#4a3524"></span></div>
   <div class="nm">活力药</div><div class="meta">ico-heal<br>art=flask_full</div></div></div></body></html>
